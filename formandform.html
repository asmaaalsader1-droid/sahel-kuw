            width: 100%;
            max-width: 450px;

            max-width: 450px;
            padding: 20px 15px;

            justify-content: center;

            background-color: #ffffff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #dcdcdc;
        }

        /* الجزء العلوي - الخلفية والعنوان */
        .header-bg {
            height: 130px;
            background: linear-gradient(to bottom, rgba(80, 20, 100, 0.3), rgba(0, 40, 120, 0.6)),

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

            display: flex;
            flex-direction: column;

            border-bottom: 1px solid #1a62ba;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .card-item:hover {
            background-color: #083b7a;
        }

        .card-item:last-child {
            border-bottom: none;
        }

        .card-text {
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
        }

        .card-icon {
            color: #ffffff;

            </div>

            <div class="services-list">
                
                <div class="card-item" data-url="fingerprint-appointment.html">

                    <div class="card-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                </div>

                        <i class="fa-solid fa-camera-retro"></i>
                    </div>

                       <i class="fa-solid fa-id-card"></i>

            <div class="card-icon">

                  </div>
               </div>

            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.card-item');

            cards.forEach(card => {
                card.addEventListener('click', function() {
                    const targetPage = this.getAttribute('data-url');
                    if (targetPage) {
                        window.location.href = targetPage;
                    }
                });
            });
        });
    </script>
