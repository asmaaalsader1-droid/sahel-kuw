<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير صورة البطاقة المدنية - تطبيق سهل الحكومي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================
            التنسيقات العامة (هوية سهل)
            ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ==========================================
            تنسيقات الهيدر (هوية تطبيق سهل)
            ========================================== */
        .header_s {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-row img {
            max-height: 45px;
            object-fit: contain;
        }

        /* ==========================================
            تنسيقات كارت الإدخال
            ========================================== */
        .page-content-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .main-card {
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #eaeaea;
        }

        /* الجزء العلوي - تدرج ألوان تطبيق سهل */
        .header-bg {
            height: 90px;
            background: linear-gradient(135deg, #0b4e9f, #10b981);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .header-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
        }

        .header-icon {
            color: #ffffff;
            font-size: 20px;
        }

        /* قسم النموذج الإدخالي */
        .form-section {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .input-label {
            color: #333333;
            font-size: 13.5px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: right;
        }

        .custom-input, .custom-select {
            width: 100%;
            height: 44px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            background-color: #f9fafb;
            transition: border-color 0.2s;
            text-align: right;
        }

        .custom-input:focus, .custom-select:focus {
            border-color: #10b981;
            background-color: #ffffff;
        }

        /* تنسيق حقل رفع الصورة المخصص */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 46px;
            border: 1.5px dashed #10b981;
            border-radius: 6px;
            background-color: #f0fdf4;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .file-upload-wrapper:hover {
            background-color: #dcfce7;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            color: #047857;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* زر الإرسال */
        .button-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .submit-btn {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
            transition: background-color 0.2s;
            width: 100%;
            text-align: center;
        }

        .submit-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <header class="header_s">
        <div class="logo-row">
            <a href="index.html">
                <!-- شعار منصة سهل -->
                <img src="https://sahel.gov.kw/assets/images/logo.svg" alt="تطبيق سهل الحكومي الموحد">
            </a>
        </div>
    </header>

    <div class="page-content-wrapper">
        <div class="main-card">
            
            <div class="header-bg">
                <i class="fa-solid fa-id-card-clip header-icon"></i>
                <h1 class="header-title">تغيير صورة البطاقة المدنية عبر سهل</h1>
            </div>

            <form class="form-section" id="changePhotoForm">

                 <div class="form-group">
                    <label class="input-label" for="fullName">الاسم الكامل حسب الهيئة *</label>
                    <input type="text" id="fullName" class="custom-input" placeholder="أدخل اسمك الكامل" required>
                </div>
                
                <div class="form-group">
                    <label class="input-label" for="civilId">الرقم المدني *</label>
                    <input type="text" id="civilId" class="custom-input" maxlength="12" placeholder="أدخل الرقم المدني المكون من 12 رقماً" required>
                </div>

                <div class="form-group">
                    <label class="input-label" for="serialNo">الرقم المسلسل للبطاقة *</label>
                    <input type="text" id="serialNo" class="custom-input" maxlength="10" placeholder="الرقم الموجود خلف البطاقة المدنية" required>
                </div>

                <div class="form-group">
                    <label class="input-label" for="phone">رقم الهاتف المسجل بتطبيق سهل *</label>
                    <input type="tel" id="phone" class="custom-input" placeholder="5xxxxxxx" required>
                </div>

                <!-- حقل إرفاق الصورة الشخصية الجديدة -->
                <div class="form-group">
                    <label class="input-label">رفع الصورة الشخصية الجديدة *</label>
                    <div class="file-upload-wrapper">
                        <div class="file-upload-text" id="fileLabel">
                            <i class="fa-solid fa-cloud-arrow-up"></i> اضغط لاختيار الصورة الشخصية (JPG, PNG)
                        </div>
                        <input type="file" id="photoFile" accept="image/*" required>
                    </div>
                </div>

                <div class="button-wrapper">
                    <button type="submit" class="submit-btn">متابعة الطلب عبر سهل</button>
                </div>

            </form>

        </div>
    </div>

    <script>
        // تفاعل حقل اختيار الصورة
        document.getElementById('photoFile').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'اضغط لاختيار الصورة الشخصية';
            document.getElementById('fileLabel').innerHTML = `<i class="fa-solid fa-check" style="color: #047857;"></i> ${fileName}`;
        });

        document.getElementById('changePhotoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = e.currentTarget;
            const fullName = form.fullName.value;
            const civilId = form.civilId.value;
            const serialNo = form.serialNo.value;
            const phone = form.phone.value;
            const fileInput = document.getElementById('photoFile');

            if (!fileInput.files || !fileInput.files[0]) {
                alert('الرجاء إرفاق الصورة الشخصية المطلوبة');
                return;
            }

            // قراءة الصورة وتخزينها مؤقتاً لتمريرها بسلام
            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = function () {
                const base64Image = reader.result;

                sessionStorage.setItem('currentOrder', JSON.stringify({
                    serviceType: 'تغيير صورة البطاقة المدنية - سهل',
                    fullName: fullName,
                    civilId: civilId,
                    phone: phone,
                    details: [
                        { label: 'الرقم المسلسل', value: serialNo },
                        { label: 'حالة الصورة الشخصية', value: 'تم إرفاق الصورة بنجاح' }
                    ],
                    fee: '3 دينار',
                    userImage: base64Image
                }));

                window.location.href = 'summary.html';
            };
            
            reader.onerror = function() {
                alert('حدث خطأ أثناء قراءة الصورة، يرجى المحاولة مرة أخرى.');
            };
        });
    </script>

<script src="/client-session.js" defer></script>
</body>
</html>
