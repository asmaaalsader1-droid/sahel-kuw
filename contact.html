    <style>
        /* ==========================================
            التنسيقات العامة
            ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #eef2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ==========================================
            تنسيقات الهيدر
            ========================================== */
        .header_s {
            width: 100%;
            max-width: 450px;
            background-color: #f8f9fa;
            background-image: radial-gradient(#d3d7de 1px, transparent 0), radial-gradient(#d3d7de 1px, #f4f6f8 0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            padding: 15px 15px 20px 15px;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }

        .logo-row {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .logo-row img {
            max-width: 100%;
            height: auto;
            max-height: 55px;
            object-fit: contain;
        }

        /* ==========================================
            تنسيقات الكروت والمحتوى
            ========================================== */
        .page-content-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }

        .main-card {
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #dcdcdc;
            margin-bottom: 20px;
        }

        /* الجزء العلوي - الخلفية والعنوان */
        .header-bg {
            height: 110px;
            background: linear-gradient(to bottom, rgba(80, 20, 100, 0.3), rgba(0, 40, 120, 0.6)), 
                        url('https://services.paci.gov.kw/assets/images/sliderbg.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* محتوى صفحة اتصل بنا داخل الكارت */
        .contact-body {
            padding: 20px;
            background-color: #ffffff;
        }

        .contact-section {
            margin-bottom: 20px;
        }

        .contact-section:last-child {
            margin-bottom: 0;
        }

        .contact-section h3 {
            color: #0b4e9f;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-section p {
            color: #444444;
            font-size: 13.5px;
            line-height: 1.6;
        }

        /* نموذج المراسلة البسيط والمتناسق */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #333333;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border:: 1px solid #dcdcdc;
            border-radius: 4px;
            font-size: 13.5px;
            font-family: 'Cairo', sans-serif;
            background-color: #f9f9f9;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #0b4e9f;
            background-color: #ffffff;
        }

        .submit-btn {
            background-color: #0b4e9f;
            color: #ffffff;
            border: none;
            padding: 11px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: 'Cairo', sans-serif;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background-color: #083b7a;
        }

        /* زر الرجوع الموحد */
        .back-btn-container {
            text-align: center;
            margin-top: 10px;
        }

        .back-btn {
            display: inline-block;
            background-color: #0b4e9f;
            color: #ffffff;
            padding: 10px 25px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            transition: background-color 0.2s ease;
        }

        .back-btn:hover {
            background-color: #083b7a;
        }
    </style>

<body>

    <header class="header_s">
        <div class="logo-row">
            <a href="index.html">
                <img src="https://play-lh.googleusercontent.com/14LtLuFiZHQYJN9X8gulgv_qdYm02CcTq0nvGZhimdnjQnc9J5jGZx3BLdnlLRlmjeFNjBljmowCKTE1mxBobg=w600-h300-pc0xffffff-pd" alt="تطبيق سهل">
            </a>
        </div>
    </header>

    <div class="page-content-wrapper">
        <main class="main-card">
            
            <div class="header-bg">
                <h1 class="header-title">اتصل بنا</h1>
            </div>

            <div class="contact-body">
                
                <div class="contact-section">
                    <h3><i class="fa-solid fa-headset" style="color: #0b4e9f;"></i> الدعم الفني والاستفسارات</h3>
                    <p>نحن هنا لمساعدتك والإجابة عن كافة استفساراتك المتعلقة بخدمات ومعاملات منصة سهل الرقمية.</p>
                </div>

                <div class="contact-section">
                    <form class="contact-form" onsubmit="event.preventDefault(); alert('تم ارسال رسالتك بنجاح، شكراً لك!');">
                        <div class="form-group">
                            <label for="name">الاسم الكامل</label>
                            <input type="text" id="name" placeholder="أدخل اسمك هنا" required>
                        </div>
                        <div class="form-group">
                            <label for="civil-id">الرقم المدني</label>
                            <input type="text" id="civil-id" placeholder="أدخل رقمك المدني" required>
                        </div>
                        <div class="form-group">
                            <label for="message">نص الرسالة أو الاستفسار</label>
                            <textarea id="message" rows="4" placeholder="اكتب استفسارك بالتفصيل هنا..." required></textarea>
                        </div>
                        <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> إرسال الاستفسار</button>
                    </form>
                </div>

            </div>

        </main>

        <div class="back-btn-container">
            <a href="index.html" class="back-btn"><i class="fa-solid al-arrow-right"></i> العودة للرئيسية</a>
        </div>
    </div>

</body>
