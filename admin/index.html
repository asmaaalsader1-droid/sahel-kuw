<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم - سهل</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<section id="loginPage" class="auth-page"><div class="auth-card"><div class="auth-logo">س</div><p class="eyebrow">بوابة الإدارة</p><h1>تسجيل الدخول</h1><p class="muted">أدخل بيانات الحساب المصرّح به للوصول إلى لوحة العملاء.</p><form id="loginForm"><label>البريد الإلكتروني</label><input id="email" type="email" value="msola8228@gmail.com" autocomplete="username" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" class="primary-btn">دخول آمن</button><p id="loginError" class="error"></p></form></div></section>
<div id="appShell" class="hidden"><header class="top-navbar"><div class="nav-right"><div class="user-profile"><span>مدير النظام</span><div class="user-avatar">م</div></div><div class="nav-icons"><div class="header-stats"><div class="stat-item stat-online">● <span id="activeStat">0</span> نشط</div><div class="stat-item stat-today">◷ اليوم <span id="todayStat">0</span></div><div class="stat-item stat-total">▤ إجمالي <span id="totalStat">0</span></div><div class="stat-item stat-visitors">◉ زوار <span id="visitorStat">0</span></div><div class="stat-item stat-clients">● عملاء <span id="clientStat">0</span></div></div><span class="bell">●<b>15</b></span><span>⚙</span></div></div><div class="nav-left"><strong>لوحة التحكم</strong><button id="logoutBtn" class="logout-btn">خروج</button></div></header>
<div class="main-container"><aside class="sidebar"><div class="sidebar-header"><div class="search-box"><span>⌕</span><input id="customerSearch" placeholder="بحث باسم العميل أو الرقم المدني المقنّع"></div><div class="sidebar-tabs"><button class="tab active" data-filter="all">الكل <b id="allCount">0</b></button><button class="tab" data-filter="active">النشط</button><button class="tab" data-filter="archive">الأرشيف</button></div></div><div class="select-all-bar"><input type="checkbox" id="selectAll"><label for="selectAll">تحديد الكل</label></div><div id="customerList" class="chat-list"></div></aside><main class="content-area"><div class="content-header"><div class="action-buttons"><button class="btn btn-danger">حذف</button><button class="btn btn-warning">أرشفة</button></div><div class="route-tools"><select><option>توجيه العميل إلى صفحة...</option><option>الصفحة الرئيسية</option><option>حجز موعد</option><option>تعديل العنوان</option></select><button id="customerRefreshBtn" class="btn btn-refresh" title="تحديث بيانات العميل" disabled>↻ تحديث العميل</button><span id="selectedCustomerTitle" class="user-title">اختر عميلًا من القائمة</span></div></div><div id="customerMeta" class="meta-info-bar hidden"></div><div id="emptyState" class="empty-state"><div class="empty-icon">◌</div><h2>اختر عميلًا</h2><p>ستظهر هنا كل تسجيلاته مرتبة حسب وقت الحفظ.</p></div><div id="feedContainer" class="feed-container hidden"></div></main></div></div><script src="/admin/admin.js"></script></body></html>
